<div class="fit-finder-container">
    <iframe
      id="fit-finder-iframe"
      src="https://fit-finder-topaz.vercel.app/"
      width="100%"
      height="1200"
      frameborder="0"
      style="border: none; border-radius: 8px; overflow: hidden"
      loading="lazy"
    >
    </iframe>
  </div>
  
  <style>
  /* Hide scrollbar for webkit browsers (Chrome, Safari, Edge) */
  ::-webkit-scrollbar {
    width: 0px;
    background: transparent; /* make scrollbar transparent */
  }
  
  /* Hide scrollbar for Firefox */
  html {
    scrollbar-width: none; /* Firefox */
  }
  
  /* Alternative method - hide scrollbar but keep functionality */
  body {
    overflow-y: scroll; /* Always show scroll area */
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* Internet Explorer 10+ */
  }
  
  body::-webkit-scrollbar {
    width: 0;
    height: 0;
  }
  
  /* Prevent scroll jumping when iframe resizes */
  .fit-finder-container {
    scroll-behavior: auto !important;
    position: relative;
  overflow:hidden;
  }
  
  /* Smooth transitions for iframe height changes */
  #fit-finder-iframe {
    transition: height 0.2s ease-out !important;
    transform: translateZ(0); /* Force hardware acceleration */
    will-change: height; /* Optimize for height changes */
  }
  
  /* Prevent scroll jumping during dropdown interactions */
  body {
    scroll-behavior: auto !important;
  }
  
  /* Ensure iframe doesn't cause layout shifts */
  .fit-finder-container iframe {
    display: block;
    margin: 0;
    padding: 0;
  }

  </style>

  <script>
    (function () {
      var iframe = document.getElementById("fit-finder-iframe");
      if (!iframe) return;

      var queued = false;

      // The Fit Finder is served from another origin, so anything it writes to
      // localStorage lands on that origin, not the storefront's. It sends the
      // final result over instead and we store it here, where the persistent
      // fit bar can actually read it.
      var appOrigin = new URL(iframe.src, window.location.href).origin;

      // The iframe is stretched to its full content height, so its own viewport
      // covers the whole app and it cannot tell what is actually on screen.
      // Tell it, so dropdowns can open into visible space instead of scrolling
      // this page to reach themselves.
      function sendViewport() {
        queued = false;
        if (!iframe.contentWindow) return;
        iframe.contentWindow.postMessage(
          {
            type: "PARENT_VIEWPORT",
            iframeTop: iframe.getBoundingClientRect().top,
            viewportHeight: window.innerHeight
          },
          "*"
        );
      }

      function queueViewport() {
        if (queued) return;
        queued = true;
        requestAnimationFrame(sendViewport);
      }

      window.addEventListener("message", function (e) {
        if (!e.data) return;
        if (e.data.type === "IFRAME_HEIGHT_UPDATE") {
          iframe.style.height = e.data.height + "px";
          queueViewport();
        } else if (e.data.type === "REQUEST_PARENT_VIEWPORT") {
          sendViewport();
        } else if (e.data.type === "VOYAGERS_FIT_UPDATED") {
          if (e.origin !== appOrigin) return;
          try {
            localStorage.setItem("voyagersFit", JSON.stringify(e.data.payload));
            // Let the fit bar update without waiting for the next page load.
            window.dispatchEvent(
              new CustomEvent("voyagersFit:updated", { detail: e.data.payload })
            );
          } catch (err) {
            console.warn("Could not save voyagersFit:", err);
          }
        }
      });

      window.addEventListener("scroll", queueViewport, { passive: true });
      window.addEventListener("resize", queueViewport);
      iframe.addEventListener("load", sendViewport);
      sendViewport();
    })();
  </script>
